<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Calculator</title>
</head>
<body>

    <h1>JavaScript Calculator</h1>

    <label>First Number:</label>
    <input type="number" id="number1">
    <br><br>

    <label>Second Number:</label>
    <input type="number" id="number2">
    <br><br>

    <button id="addButton">Add</button>
    <button id="subtractButton">Subtract</button>
    <button id="multiplyButton">Multiply</button>
    <button id="divideButton">Divide</button>

    <h2>Result</h2>
    <p id="result">No calculation yet.</p>

    <h2>Calculation History</h2>
    <button id="historyButton">Show History</button>
    <button id="clearButton">Clear History</button>

    <ul id="historyList"></ul>

    <script src="./index.js"></script>
</body>
</html>
